order: 12
name: "Red eyes"
category: posters
home: true
year: "2026"
tools: "photoshop, affinity"
context:
  fr: "affiche / couleur"
  en: "poster / colour"
vision:
  fr: "des bandes rouges qui recadrent un regard, comme un écran qui ne montre que l’essentiel."
  en: "red bands reframing a gaze, like a screen that only shows what matters."
cover: ./cover.jpg
frames:
  - image: ./cover.jpg
  - label:
      fr: "(moodboard)"
      en: "(moodboard)"
    text:
      fr: "tout part de l’effet yeux rouges du flash, ce petit défaut photo qui donne un regard étrange. autour, du rouge partout : encre qui coule, fleurs, ciel flou, grain d’impression. une seule couleur, poussée jusqu’à saturer l’image."
      en: "it all starts from the red-eye effect of a flash, that small photo flaw that gives a strange gaze. around it, red everywhere: dripping ink, flowers, a blurred sky, print grain. a single colour, pushed until it saturates the image."
  - image: ./moodboard.jpg
  - image: ./detail-01.jpg
  - label:
      fr: "(détail 01)"
      en: "(detail 01)"
    text:
      fr: "seuls les yeux restent visibles, recadrés en bandeaux. les pupilles rouges du flash deviennent le seul point de contact avec celui qui regarde l’affiche."
      en: "only the eyes stay visible, cropped into bands. the red flash pupils become the only point of contact with whoever looks at the poster."
  - image: ./detail-02.jpg
  - label:
      fr: "(détail 02)"
      en: "(detail 02)"
    text:
      fr: "une fleur dessinée d’un trait rouge fin, presque à main levée. elle apporte de la douceur et du mouvement face aux aplats francs du reste de l’image."
      en: "a flower drawn with a thin red line, almost freehand. it brings softness and movement against the solid blocks of the rest of the image."
  - image: ./detail-03.jpg
  - label:
      fr: "(détail 03)"
      en: "(detail 03)"
    text:
      fr: "des aplats rouges purs, avec le titre « red eyes » écrit ton sur ton, à peine visible. le rouge prend toute la place, jusqu’à presque effacer le texte."
      en: "pure red blocks, with the title “red eyes” written tone on tone, barely visible. the red takes all the space, until it almost erases the text."
