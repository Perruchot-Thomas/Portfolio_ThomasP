    text:
      fr: "l’œil occupe toute la jaquette. les pansements rouges posés en croix parlent de la fatigue des écrans : on regarde tellement qu’il faut finir par soigner nos yeux."
      en: "the eye fills the whole case. the red bandages crossed over it speak about screen fatigue: we look so much that we end up having to heal our eyes."
  - label:
      fr: "(la jaquette)"
      en: "(the case)"
    text:
      fr: "j’ai repris les codes d’une boîte de console, logo vertical et bande blanche, pour que l’image ressemble à un objet qu’on pourrait trouver en rayon."
      en: "i borrowed the codes of a console box, vertical logo and white band, so the image feels like an object you could find on a shelf."
