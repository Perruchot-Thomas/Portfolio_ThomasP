order: 4
name: "Who are you ?"
category: posters
home: true
year: "2026"
tools: "photoshop"
context:
  fr: "expérimentation / collage"
  en: "experiment / collage"
vision:
  fr: "des visages découpés dans des formes noires qui posent une question simple : qui es-tu vraiment ?"
  en: "faces cut out of black shapes asking one simple question: who are you, really?"
cover: ./cover.jpg
frames:
  - image: ./cover.jpg
  - label:
      fr: "(moodboard)"
      en: "(moodboard)"
    text:
      fr: "des formes low poly, comme dans les jeux ps1, et des portraits flous ou cassés. l’idée est de briser l’image qu’on se fait des gens, de montrer toute la complexité cachée dans la forme simple de l’humain. who are you appelle à l’introspection."
      en: "low poly shapes, like in ps1 games, and blurred or broken portraits. the idea is to break the image we have of people, to show all the complexity hidden in the simple shape of a human. who are you calls for introspection."
  - image: ./moodboard.jpg
  - image: ./detail-01.jpg
  - label:
      fr: "(détail 01)"
      en: "(detail 01)"
    text:
      fr: "les visages sont découpés dans des formes noires anguleuses, comme des modèles 3d à peu de polygones. réduits à quelques facettes, ils restent pourtant lisibles et expressifs."
      en: "the faces are cut out of angular black shapes, like 3d models with few polygons. reduced to a few facets, they still remain readable and expressive."
  - image: ./detail-02.jpg
  - label:
      fr: "(détail 02)"
      en: "(detail 02)"
    text:
      fr: "en fond, une texture grise parcourue de fissures blanches. c’est la cassure : une surface lisse qui se fend, comme l’image qu’on a de quelqu’un quand on regarde de plus près."
      en: "in the background, a grey texture crossed by white cracks. this is the break: a smooth surface that splits, like the image we have of someone when we look closer."
  - image: ./detail-03.jpg
  - label:
      fr: "(détail 03)"
      en: "(detail 03)"
    text:
      fr: "la question est éclatée en trois mots, étirés, doublés et floutés. on la lit par morceaux, comme une pensée qui revient en boucle et qu’on finit par se poser à soi-même."
      en: "the question is split into three words, stretched, doubled and blurred. you read it in pieces, like a thought on a loop that you end up asking yourself."
