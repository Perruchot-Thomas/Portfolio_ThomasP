order: 5
name: "Bouche étoile"
category: covers
home: true
year: "2026"
tools: "photoshop"
context:
  fr: "cover / musique"
  en: "cover / music"
vision:
  fr: "une bouche grande ouverte qui avale une étoile, entre cri et chant."
  en: "a wide open mouth swallowing a star, somewhere between a scream and a song."
role:
  title:
    fr: "direction artistique et création de la cover"
    en: "art direction and cover design"
  brief:
    fr: "une cover musicale dans un univers gothique : une bouche grande ouverte, entre cri et chant, qui avale une étoile."
    en: "a music cover in a gothic universe: a wide-open mouth, between a scream and a song, swallowing a star."
  done:
    fr: "le moodboard et la cover sur photoshop : bouche teintée de violet avec ses crocs, texture de dentelle en fond et étoile argentée en relief, mon signe."
    en: "the moodboard and the cover in photoshop: a purple-tinted mouth with its fangs, a lace-like texture in the background and a silver relief star, my signature."
cover: ./cover.jpg
frames:
  - image: ./cover.jpg
  - label:
      fr: "(moodboard)"
      en: "(moodboard)"
    text:
      fr: "l’aspect voulu était surtout gothique. c’est ce qui explique les bouches grandes ouvertes, les crocs et l’étoile noire aux pointes acérées, mais aussi la dentelle, les ornements anciens et les textures usées. un univers sombre et précieux à la fois, entre douceur et morsure."
      en: "the look i wanted was above all gothic. that is what explains the wide open mouths, the fangs and the black star with sharp points, but also the lace, the old ornaments and the worn textures. a world both dark and precious, between softness and bite."
  - image: ./moodboard.jpg
  - image: ./detail-01.jpg
  - label:
      fr: "(détail 01)"
      en: "(detail 01)"
    text:
      fr: "la bouche remplit tout le cadre, teintée de violet, avec deux crocs de vampire qui dépassent, clin d’œil direct à l’univers gothique. on ne sait pas si elle crie ou si elle chante, et c’est cette hésitation que je voulais garder pour une cover."
      en: "the mouth fills the whole frame, tinted purple, with two vampire fangs sticking out, a direct nod to the gothic world. you can’t tell if it screams or sings, and that hesitation is what i wanted to keep for a cover."
  - image: ./detail-02.jpg
  - label:
      fr: "(détail 02)"
      en: "(detail 02)"
    text:
      fr: "en fond, une texture pâle travaillée comme une dentelle, avec des ornements presque effacés. elle prolonge l’aspect gothique tout en adoucissant l’image, comme un vieux tissu précieux."
      en: "in the background, a pale texture worked like lace, with almost faded ornaments. it extends the gothic look while softening the image, like an old precious fabric."
  - image: ./detail-03.jpg
  - label:
      fr: "(détail 03)"
      en: "(detail 03)"
    text:
      fr: "l’étoile argentée, en relief, est mon signe : sidus veut dire astre en latin. posée dans la bouche, elle devient la voix qu’on s’apprête à entendre."
      en: "the embossed silver star is my sign: sidus means star in latin. placed in the mouth, it becomes the voice you are about to hear."
