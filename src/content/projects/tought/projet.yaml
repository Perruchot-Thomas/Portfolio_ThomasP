order: 2
name: "TOUGHT"
category: posters
home: true
year: "2026"
tools: "affinity"
context:
  fr: "exploration personnelle / prise de position politique"
  en: "personal exploration / political statement"
vision:
  fr: "une identité texturale brute qui puise dans l’esthétique de la rue pour amplifier un message radical."
  en: "a raw textural identity using street aesthetics to amplify a radical message."
cover: ./cover.jpg
frames:
  - image: ./cover.jpg
  - label:
      fr: "(moodboard)"
      en: "(moodboard)"
    text:
      fr: "je voulais que l’environnement paraisse immédiatement froid, brut et urbain, dominé par des gris lourds. il était essentiel pour moi d’installer cette atmosphère de rue viscérale avant même de penser à la mise en page finale de l’affiche. ce fond granuleux n’est pas qu’une texture : il a été construit pour porter un message de révolte et un appel direct à l’action. je voulais un message très visuel, avec des références directes à la révolte populaire."
      en: "i wanted the environment to feel immediately cold, raw, and urban, dominated by heavy grey tones. for me, it was essential to establish this visceral street atmosphere before even considering the final poster layout. this gritty background is not just a texture; it was specifically built to carry a message of revolt and a direct call to action. i wanted the message to be highly visual by placing direct references to popular revolt."
  - image: ./image-01.jpg
  - image: ./image-02.png
  - label:
      fr: "(détail 01)"
      en: "(detail 01)"
    text:
      fr: |-
        “when words are not strong enough * actions are all we have left”.
        
        j’ai placé exactement la même phrase en arrière-plan, inversée, floutée et déformée. en modifiant sa position et en cassant sa lisibilité, je voulais montrer que le texte perd littéralement tout son sens. c’est ma façon de prouver visuellement que les mots seuls ne servent plus à rien.
      en: |-
        “when words are not strong enough * actions are all we have left”.
        
        i placed this exact same sentence in the background, reversed, blurred, and distorted. by altering its position and breaking its legibility, i wanted to show that the text literally loses all its meaning. it is my way to visually prove that words alone are useless now.
  - label:
      fr: "(le titre central)"
      en: "(the central title)"
    text:
      fr: "pour le message massif au centre, j’ai intégré des tags de rue, notamment le mot acab (1312). il accompagne l’idée principale : la nécessité d’une contestation physique. cet aspect urbain incarne directement l’action populaire. le mot “tought” est volontairement peu lisible, car je voulais montrer que son vrai message ne se trouve plus dans les mots."
      en: "for the massive message in the middle, i embedded street tags, notably the word acab (1312). it accompanies the main idea: the need for physical protest. this street and urban aspect directly embodies popular action. the word “tought” itself is intentionally quite illegible, because i wanted to show that its true message is no longer found in the words."
  - label:
      fr: "(la matière grise)"
      en: "(the grey matter)"
    text:
      fr: "le fond grisâtre est d’abord là pour apporter une texture brute à l’affiche. je m’en suis aussi servi pour flouter volontairement certaines parties, comme le titre principal, qui s’enfonce dans le mur. ces gris lourds définissent l’atmosphère urbaine, en écho direct au message de rue de la pièce."
      en: "the greyish background is primarily here to bring raw texture to the poster. i also used it to intentionally blur certain parts, like the main title, making it sink into the wall. these heavy grey tones define the urban atmosphere, directly echoing the street-level message of the piece."
